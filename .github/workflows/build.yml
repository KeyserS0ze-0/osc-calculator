name: Build module
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28
          cmake --build build
      - name: Package
        run: |
          mkdir -p osc-toolkit
          cp manifest.json osc-toolkit/
          cp build/libosc_toolkit.so osc-toolkit/
          zip -r osc-toolkit.levipack osc-toolkit
      - uses: actions/upload-artifact@v4
        with:
          name: osc-toolkit
          path: osc-toolkit.levipack
