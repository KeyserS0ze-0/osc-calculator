
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSC Strike Calculator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #090909;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 24px;
  background: #151515;
  border: 1px solid #333;
  border-radius: 18px;
}

.header {
  text-align: center;
  margin-bottom: 26px;
}

.header h1 {
  margin: 0 0 8px;
  font-size: 26px;
  letter-spacing: 1px;
}

.header p {
  color: #999;
  font-size: 13px;
}

.label {
  display: block;
  margin: 20px 0 8px;
  color: #ddd;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
}

input {
  width: 100%;
  min-height: 54px;
  padding: 14px;
  border: 2px solid #b83232;
  border-radius: 10px;
  background: #0b0b0b;
  color: white;
  font-size: 18px;
  outline: none;
  transition: border-color .2s, background .2s;
}

input:focus {
  border-color: #ff6868;
}

input.empty,
input.invalid {
  border-color: #e53939;
  animation: pulse 1.3s infinite;
}

input.valid {
  border-color: #32d879;
  background: #0d2015;
  animation: none;
}

@keyframes pulse {
  0%, 100% {
    box-shadow: 0 0 0 0 #e5393922;
  }
  50% {
    box-shadow: 0 0 10px 2px #e5393955;
  }
}

.hint {
  margin-top: 7px;
  color: #888;
  font-size: 12px;
}

button {
  width: 100%;
  min-height: 52px;
  margin-top: 16px;
  padding: 13px;
  border: 1px solid #444;
  border-radius: 10px;
  background: #292929;
  color: #f5f5f5;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: .5px;
  cursor: pointer;
  touch-action: manipulation;
  transition: background .2s, border-color .2s, transform .1s;
}

button:hover {
  background: #353535;
  border-color: #666;
}

button:active {
  background: #202020;
  transform: scale(.98);
}

.status {
  margin-top: 18px;
  padding: 12px;
  border-radius: 8px;
  background: #222;
  color: #ff7777;
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .5px;
  overflow-wrap: anywhere;
}

.status.success {
  color: #43e58b;
  background: #102419;
}

.results {
  margin-top: 22px;
  padding: 16px;
  border: 1px solid #333;
  border-radius: 12px;
  background: #101010;
}

.results h2 {
  margin: 0 0 14px;
  font-size: 15px;
}

.result-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid #292929;
  font-size: 14px;
}

.result-row:last-child {
  border-bottom: none;
}

.result-value {
  font-weight: bold;
  text-align: right;
  overflow-wrap: anywhere;
}

.footer {
  margin-top: 20px;
  color: #666;
  font-size: 11px;
  text-align: center;
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <h1>OSC STRIKE CALCULATOR</h1>
    <p>BEDROCK EDITION · X / Z COORDINATES</p>
  </div>

  <form id="calculator" novalidate>
    <label class="label" for="cannon">
      YOUR LOCATION (X, Z)
    </label>

    <input
      id="cannon"
      type="text"
      inputmode="text"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="Example: 250, 100"
      aria-label="Your X and Z coordinates"
    >

    <div class="hint">
      Enter both coordinates, separated by a comma.
    </div>

    <label class="label" for="target">
      TARGET LOCATION (X, Z)
    </label>

    <input
      id="target"
      type="text"
      inputmode="text"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="Example: 1000, 400"
      aria-label="Target X and Z coordinates"
    >

    <label class="label" for="stack">
      BLOCKS PER STACK
    </label>

    <input
      id="stack"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      value="64"
      aria-label="Blocks per stack"
    >

    <button class="lock-button" type="submit">
      LOCK IN &amp; CALCULATE
    </button>
  </form>

  <div id="status" class="status" role="status" aria-live="polite">
    AWAITING COORDINATES
  </div>

  <div class="results">
    <h2>CALCULATION RESULTS</h2>

    <div class="result-row">
      <span>Horizontal distance</span>
      <span class="result-value" id="distance">—</span>
    </div>

    <div class="result-row">
      <span>X distance</span>
      <span class="result-value" id="dx">—</span>
    </div>

    <div class="result-row">
      <span>Z distance</span>
      <span class="result-value" id="dz">—</span>
    </div>

    <div class="result-row">
      <span>Full stacks</span>
      <span class="result-value" id="stacks">—</span>
    </div>

    <div class="result-row">
      <span>Remaining blocks</span>
      <span class="result-value" id="remaining">—</span>
    </div>

    <div class="result-row">
      <span>Total blocks</span>
      <span class="result-value" id="total">—</span>
    </div>
  </div>

  <button id="copy" type="button">
    COPY CALCULATION
  </button>

  <button id="reset" type="button">
    RESET CALCULATOR
  </button>

  <div class="footer">
    OSC SYSTEM · READY WHEN YOU ARE
  </div>
</div>

<script>
const form = document.getElementById("calculator");
const cannon = document.getElementById("cannon");
const target = document.getElementById("target");
const stack = document.getElementById("stack");
const statusBox = document.getElementById("status");

const allFields = [cannon, target, stack];

let lockedResult = null;

function parseCoordinates(value) {
  const parts = value.trim().split(/\s*,\s*|\s+/);

  if (
    parts.length !== 2 ||
    parts.some(part => part === "")
  ) {
    return null;
  }

  const x = Number(parts[0]);
  const z = Number(parts[1]);

  if (!Number.isFinite(x) || !Number.isFinite(z)) {
    return null;
  }

  return { x, z };
}

function setStatus(message, success = false) {
  statusBox.textContent = message;
  statusBox.classList.toggle("success", success);
}

function clearResults() {
  [
    "distance",
    "dx",
    "dz",
    "stacks",
    "remaining",
    "total"
  ].forEach(id => {
    document.getElementById(id).textContent = "—";
  });
}

function validateCoordinates(field) {
  if (!field.value.trim()) {
    field.className = "empty";
    return false;
  }

  if (!parseCoordinates(field.value)) {
    field.className = "invalid";
    return false;
  }

  field.className = "";
  return true;
}

function calculate(event) {
  if (event) {
    event.preventDefault();
  }

  if (document.activeElement instanceof HTMLElement) {
    document.activeElement.blur();
  }

  const cannonValid = validateCoordinates(cannon);
  const targetValid = validateCoordinates(target);

  const stackValue = Number(stack.value);

  const stackValid =
    stack.value.trim() !== "" &&
    Number.isSafeInteger(stackValue) &&
    stackValue > 0;

  stack.className = stackValid
    ? ""
    : (stack.value.trim() ? "invalid" : "empty");

  if (!cannonValid || !targetValid || !stackValid) {
    lockedResult = null;
    clearResults();
    setStatus("CHECK YOUR INPUTS — INVALID OR MISSING VALUE");
    return;
  }

  const start = parseCoordinates(cannon.value);
  const end = parseCoordinates(target.value);

  const dx = Math.abs(end.x - start.x);
  const dz = Math.abs(end.z - start.z);
  const distance = Math.hypot(dx, dz);

  if (!Number.isFinite(distance)) {
    lockedResult = null;
    clearResults();
    setStatus("COORDINATES TOO LARGE — CHECK YOUR INPUTS");
    return;
  }

  const total = Math.ceil(distance);
  const fullStacks = Math.floor(total / stackValue);
  const remaining = total % stackValue;

  lockedResult = {
    dx,
    dz,
    distance,
    total,
    fullStacks,
    remaining,
    stackValue
  };

  cannon.className = "valid";
  target.className = "valid";
  stack.className = "valid";

  document.getElementById("distance").textContent =
    distance.toFixed(2) + " blocks";

  document.getElementById("dx").textContent =
    dx + " blocks";

  document.getElementById("dz").textContent =
    dz + " blocks";

  document.getElementById("stacks").textContent =
    fullStacks + " stacks";

  document.getElementById("remaining").textContent =
    remaining + " blocks";

  document.getElementById("total").textContent =
    total + " blocks";

  setStatus("COORDINATES LOCKED — CALCULATION COMPLETE", true);
}

form.addEventListener("submit", calculate);

allFields.forEach(field => {
  field.addEventListener("input", () => {
    lockedResult = null;
    clearResults();

    setStatus("INPUT CHANGED — LOCK IN TO RECALCULATE");

    if (field === cannon || field === target) {
      validateCoordinates(field);
    } else {
      field.className = field.value.trim() ? "" : "empty";
    }
  });
});

document.getElementById("copy").addEventListener("click", async () => {
  if (!lockedResult) {
    setStatus("LOCK IN YOUR COORDINATES BEFORE COPYING");
    return;
  }

  const r = lockedResult;

  const text =
    `OSC STRIKE CALCULATION\n` +
    `Your location: ${cannon.value}\n` +
    `Target location: ${target.value}\n` +
    `X distance: ${r.dx} blocks\n` +
    `Z distance: ${r.dz} blocks\n` +
    `Horizontal distance: ${r.distance.toFixed(2)} blocks\n` +
    `Full stacks: ${r.fullStacks}\n` +
    `Remaining blocks: ${r.remaining}\n` +
    `Total blocks: ${r.total}\n` +
    `Stack size: ${r.stackValue}`;

  try {
    await navigator.clipboard.writeText(text);
    setStatus("CALCULATION COPIED", true);
  } catch {
    const temporary = document.createElement("textarea");
    temporary.value = text;
    document.body.appendChild(temporary);
    temporary.select();

    const copied = document.execCommand("copy");
    temporary.remove();

    setStatus(
      copied
        ? "CALCULATION COPIED"
        : "COPY FAILED — PLEASE COPY MANUALLY",
      copied
    );
  }
});

document.getElementById("reset").addEventListener("click", () => {
  cannon.value = "0, 0";
  target.value = "0, 0";
  stack.value = "64";

  lockedResult = null;
  clearResults();

  allFields.forEach(field => {
    field.className = "";
  });

  setStatus("RESET COMPLETE — TAP LOCK IN TO CALCULATE");
});

// Start with empty coordinate fields pulsing red.
cannon.className = "empty";
target.className = "empty";
</script>

</body>
</html>
