<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>OSC Toolkit</title>
<style>
*{box-sizing:border-box}
:root{--bg:#101010;--panel:#191919;--field:#101010;--border:#383838;--text:#eee;--muted:#929292;--green:#a7e8b7;--green-bg:#26372d;--red:#ff7777}
body{margin:0;padding:16px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.app{width:100%;max-width:410px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:23px;letter-spacing:1px;margin:0 0 5px}
.subtitle{color:var(--muted);font-size:10px;letter-spacing:1px}
.info-button{flex-shrink:0;padding:10px 13px;border:1px solid #659374;border-radius:9px;background:var(--green-bg);color:var(--green);font-weight:bold;font-size:12px}
.switcher{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:17px}
.switch-button{padding:12px 5px;border:1px solid var(--border);border-radius:9px;background:#1b1b1b;color:#bcbcbc;font-size:12px;font-weight:bold}
.switch-button.active{color:var(--green);background:var(--green-bg);border-color:#62856b}
.panel{padding:16px;background:var(--panel);border:1px solid #303030;border-radius:13px}
h2{font-size:16px;margin:0 0 15px;letter-spacing:.5px}
.section{margin-bottom:15px}
.label{display:block;color:#bcbcbc;font-size:11px;font-weight:bold;letter-spacing:.7px;margin-bottom:8px}
input{width:100%;min-width:0;padding:12px;color:var(--text);background:var(--field);border:1px solid var(--border);border-radius:8px;outline:none;font-size:15px}
input:focus{border-color:#888}
input.valid{border-color:#55b779}
input.invalid{border-color:#ed6565}
.hint{margin-top:5px;color:#777;font-size:10px;line-height:1.5}
.axis-box{padding:12px;margin-bottom:16px;background:#111;border:1px solid #343434;border-radius:10px}
.axis-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.axis-button{padding:10px;color:#bcbcbc;background:#202020;border:1px solid #393939;border-radius:7px}
.axis-button.active{background:var(--green-bg);color:var(--green);border-color:#62856b}
